<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f0e8">
<title>Toolbox</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<style>
  .fs-floor-picker { display: flex; gap: 8px; margin-bottom: 14px; }
  .fs-floor-picker select { flex: 1; }
  .fs-floor-picker button { flex: none; }

  .fs-new-floor { display: flex; flex-direction: column; gap: 10px; }

  .fs-plan-wrap { cursor: crosshair; }
  .fs-svg-overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  .fs-vertex { fill: var(--accent); stroke: #fff; stroke-width: 0.006; }
  .fs-boundary-line { fill: rgba(193,74,43,0.12); stroke: var(--accent); stroke-width: 0.004; }
  .fs-point { fill: var(--ink); stroke: #fff; stroke-width: 0.006; cursor: pointer; }
  .fs-point.base { fill: var(--accent); }
  .fs-point.selected { stroke: var(--accent); stroke-width: 0.01; }

  .fs-mode-row { display: flex; gap: 8px; margin: 10px 0; }
  .fs-mode-row button { flex: 1; }
  .fs-mode-row button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .fs-point-row { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .fs-point-row:last-child { border-bottom: none; }
  .fs-point-row.selected { background: var(--accent-soft); }
  .fs-point-row .fs-badge {
    width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .fs-point-row .fs-badge.base { background: var(--accent); }
  .fs-point-row .fs-meta { flex: 1; min-width: 0; font-size: 13px; }
</style>
</head>
<body>
<header class="app-bar">
  <a class="back" id="back-link" href="index.html">‹ Customer</a>
  <h1>Floor Survey</h1>
  <span></span>
</header>

<main>
  <div class="hint" style="margin-bottom:14px;">Draw the floor's outer boundary, then tap inside it to drop survey points and enter each elevation reading. Floors captured here show up in Diagnostics and Report Builder automatically.</div>

  <div id="fs-floor-picker" class="fs-floor-picker" style="display:none;">
    <select id="f-fs-floor-select"></select>
    <button type="button" id="btn-fs-new-floor" class="btn">+ New Floor</button>
  </div>

  <div id="fs-new-floor-form" class="card section-gap fs-new-floor" style="display:none;">
    <div style="font-weight:700;">New Floor</div>
    <div>
      <label for="f-fs-floor-name">Floor name</label>
      <input type="text" id="f-fs-floor-name" placeholder="1st Floor, Basement, etc.">
    </div>
    <input type="file" id="f-fs-plan-input" accept="image/*" capture="environment" style="display:none;">
    <button type="button" id="btn-fs-add-plan" class="btn">Add Plan Photo</button>
    <div id="fs-new-plan-preview"></div>
    <div class="row">
      <button type="button" id="btn-fs-create-floor" class="btn btn-primary">Create Floor</button>
      <button type="button" id="btn-fs-cancel-floor" class="btn">Cancel</button>
    </div>
  </div>

  <div id="fs-body">
    <div id="fs-plan-wrap" class="plan-photo-wrap fs-plan-wrap section-gap"></div>

    <div id="fs-boundary-controls" class="fs-mode-row" style="display:none;">
      <button type="button" id="btn-fs-undo-vertex" class="btn">Undo Point</button>
      <button type="button" id="btn-fs-finish-boundary" class="btn btn-primary" disabled>Finish Boundary</button>
    </div>

    <div id="fs-points-controls" class="fs-mode-row" style="display:none;">
      <button type="button" id="btn-fs-redraw-boundary" class="btn">Redraw Boundary</button>
    </div>

    <div id="fs-editor" class="card section-gap" style="display:none;">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div id="fs-editor-title" style="font-weight:700;"></div>
        <button type="button" id="btn-fs-done" class="btn" style="flex:none;padding:6px 14px;">Done</button>
      </div>
      <div class="row">
        <div>
          <label for="f-fs-value">Elevation reading (inches)</label>
          <input type="number" id="f-fs-value" step="0.01">
        </div>
        <div>
          <label for="f-fs-label">Label (optional)</label>
          <input type="text" id="f-fs-label" placeholder="e.g. NW corner">
        </div>
      </div>
      <div class="row" style="margin-top:10px;">
        <button type="button" id="btn-fs-delete" class="btn btn-danger">Delete Point</button>
      </div>
    </div>

    <div class="card section-gap">
      <div style="font-weight:700;margin-bottom:8px;">Points</div>
      <div id="fs-point-list"></div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="js/util.js"></script>
<script src="js/db.js"></script>
<script src="js/topo-grid.js"></script>
<script src="js/floor-survey-capture.js"></script>
</body>
</html>
