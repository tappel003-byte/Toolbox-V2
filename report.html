<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  if (navigator.serviceWorker.controller) {
    // This load is still controlled by a previously-installed worker — the
    // one serving redirects that Safari refuses. Unregistering alone does
    // not release control of an already-open tab, so force one reload once
    // the unregister completes: that reload is a fresh, uncontrolled
    // navigation with nothing left to intercept it.
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
        location.reload();
      });
    });
  } else {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { r.unregister(); });
    });
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Toolbox</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="css/styles.css">
<style>
  table.pin-schedule { width: 100%; border-collapse: collapse; background: var(--panel); }
  table.pin-schedule th, table.pin-schedule td {
    border: 1px solid var(--line); padding: 8px 10px; font-size: 14px; text-align: left; vertical-align: top;
  }
  table.pin-schedule th { background: var(--bg); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-soft); }
  .pin-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink);
    font-weight: 700; font-size: 13px; color: var(--ink);
  }
  .pin-badge.exterior { border-color: var(--ink-soft); color: var(--ink-soft); }

  .hl-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .hl-card .floor-name { font-weight: 700; margin-bottom: 8px; }
  .hl-pill { display: inline-flex; gap: 14px; font-size: 14px; font-family: monospace; }
  .hl-pill span { white-space: nowrap; }
  .hl-pill .hi { color: #2f6b3a; }
  .hl-pill .lo { color: #7a4a2b; }
</style>
</head>
<body>
<header class="app-bar">
  <a class="back" id="back-link" href="index.html">‹ Customer</a>
  <h1>Report Builder</h1>
  <span></span>
</header>

<main>
  <div class="hint" style="margin-bottom:14px;">Read-only — everything here comes straight from the drawers. To fix a description, a pin number, or delete a pin, edit it at the source; this updates automatically.</div>
  <div class="stack section-gap">
    <button type="button" id="btn-export-pdf" class="btn btn-primary" disabled>Export PDF</button>
  </div>
  <div id="report-body"><!-- filled by js/report.js --></div>
</main>

<div id="toast" class="toast"></div>

<script src="js/vendor/jspdf.umd.min.js"></script>
<script src="js/util.js"></script>
<script src="js/db.js"></script>
<script src="js/floor-survey-math.js"></script>
<script src="js/report.js"></script>
</body>
</html>
