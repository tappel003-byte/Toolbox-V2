<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f0e8">
<title>Toolbox</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<style>
  .ds-plan-wrap { cursor: crosshair; }
  .ds-pin {
    position: absolute;
    width: 26px; height: 26px;
    margin-left: -13px; margin-top: -13px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    cursor: pointer;
  }
  .ds-pin.exterior { background: var(--ink-soft); }
  .ds-pin.selected { outline: 3px solid var(--accent); outline-offset: 1px; }

  .ds-toggle-row { display: flex; gap: 8px; }
  .ds-toggle-row button { flex: 1; }
  .ds-toggle-row button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .ds-photo-strip { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .ds-photo-thumb { position: relative; width: 64px; height: 64px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .ds-photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ds-photo-thumb button {
    position: absolute; top: 0; right: 0; background: rgba(0,0,0,0.6); color: #fff;
    border: none; width: 20px; height: 20px; font-size: 13px; line-height: 1; cursor: pointer;
  }

  .ds-pin-row { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .ds-pin-row:last-child { border-bottom: none; }
  .ds-pin-row.selected { background: var(--accent-soft); }
  .ds-pin-row .ds-pin-badge {
    width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .ds-pin-row .ds-pin-badge.exterior { background: var(--ink-soft); }
  .ds-pin-row .ds-pin-meta { flex: 1; min-width: 0; }
  .ds-pin-row .ds-pin-meta .line1 { font-weight: 600; font-size: 13px; }
  .ds-pin-row .ds-pin-meta .line2 { font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<header class="app-bar">
  <a class="back" id="back-link" href="index.html">‹ Customer</a>
  <h1>Distress Survey</h1>
  <span></span>
</header>

<main>
  <div class="hint" style="margin-bottom:14px;">Tap the plan to drop a pin. Direction is figured out automatically from the front door you set during setup; pick the room, jot a description, attach photos.</div>

  <div id="ds-body">
    <div id="ds-plan-wrap" class="plan-photo-wrap ds-plan-wrap section-gap"></div>

    <div id="ds-editor" class="card section-gap" style="display:none;">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div id="ds-editor-title" style="font-weight:700;"></div>
        <button type="button" id="btn-ds-done" class="btn" style="flex:none;padding:6px 14px;">Done</button>
      </div>

      <div class="ds-toggle-row" style="margin-bottom:10px;">
        <button type="button" id="btn-ds-interior" class="btn">Interior</button>
        <button type="button" id="btn-ds-exterior" class="btn">Exterior</button>
      </div>

      <div style="margin-bottom:10px;">
        <label for="f-ds-room">Room</label>
        <select id="f-ds-room"></select>
      </div>

      <div style="margin-bottom:10px;">
        <label for="f-ds-desc">Description</label>
        <textarea id="f-ds-desc" placeholder="What's here"></textarea>
      </div>

      <div id="ds-photo-strip" class="ds-photo-strip"></div>
      <input type="file" id="f-ds-photo" accept="image/*" capture="environment" style="display:none;">
      <div class="row">
        <button type="button" id="btn-ds-photo" class="btn">Add Photo</button>
        <button type="button" id="btn-ds-delete" class="btn btn-danger">Delete Pin</button>
      </div>
    </div>

    <div class="card section-gap">
      <div style="font-weight:700;margin-bottom:8px;">Pins</div>
      <div id="ds-pin-list"></div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="js/util.js"></script>
<script src="js/db.js"></script>
<script src="js/distress-math.js"></script>
<script src="js/distress-survey.js"></script>
</body>
</html>
